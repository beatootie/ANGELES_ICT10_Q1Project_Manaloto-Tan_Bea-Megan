<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.4/core.js">
    </script>
</head>
<body>

<div class="navbar">
    <a class="brand" href="index.html">Megan and Bea's Mini Store</a>
    <div class="nav-links">
        <a class="active" href="sku.html"> SKU Generator</a>
        <a href="receipt.html"> Receipt Generator</a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <div class="header-icon"></div>
        <h1>SKU Generator</h1>
        <p class="subtitle">Fill in the product details to create its SKU</p>
    </div>

    <div id="output" class="card-body">

        <label for="category">Category</label>
        <select id="category">
            <option value="Perishables">Perishables</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Stationery">Stationery</option>
        </select>

        <label for="product_name">Product Name</label>
        <input type="text" id="product_name" placeholder="e.g. Bottled Water">

        <label for="stock_quantity">Stock Quantity</label>
        <input type="number" id="stock_quantity" placeholder="e.g. 50">

        <button py-click="generate_sku">GENERATE SKU</button>

        <hr>

        <div id="result">
            Your generated SKU will appear here.
        </div>

        <script type="py" src="./sku.py"></script>

    </div>
</div>



</body>
</html>
